<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonBronze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="neonSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0eafc" />
      <stop offset="100%" stop-color="#cfdef3" />
    </linearGradient>

    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .node-card {
      transition: all 0.3s ease;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: flowDash 20s linear infinite;
    }
    @keyframes flowDash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    .pulse-dot {
      animation: pulseAnim 3s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #00f2fe); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      fill: #ffffff;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #94a3b8;
    }
    .tag-badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background container with tech border -->
  <rect x="2" y="2" width="946" height="356" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle header badge -->
  <rect x="25" y="22" width="220" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="40" cy="36" r="4" fill="#00f2fe" class="pulse-dot" />
  <text x="52" y="40" class="tag-badge" fill="#38bdf8">DATABRICKS ENTERPRISE LAKEHOUSE</text>

  <text x="25" y="78" class="title-text" font-size="18" fill="#f8fafc">Production Medallion Lakehouse &amp; AI Engine</text>
  <text x="25" y="96" class="sub-text">Architected for high throughput, zero schema drift, Mosaic AI model serving &amp; continuous FinOps governance</text>

  <!-- Pipeline Connector Stream (Animated Dashed Line) -->
  <path d="M 160 215 L 310 215 L 460 215 L 610 215 L 770 170" fill="none" stroke="#00f2fe" stroke-width="2.5" class="flow-line" opacity="0.8" filter="url(#glowCyan)" />
  <path d="M 610 215 L 770 265" fill="none" stroke="#ff5722" stroke-width="2.5" class="flow-line" opacity="0.8" />

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(30, 140)" class="node-card">
    <rect width="140" height="150" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#1e3a8a" />
    <text x="18" y="25" class="tag-badge" fill="#60a5fa">SOURCE</text>
    <text x="12" y="52" class="title-text" font-size="13">1. Ingestion</text>
    <text x="12" y="70" class="sub-text">ADF / Kafka</text>
    <text x="12" y="85" class="sub-text">SAP HANA / APIs</text>
    <text x="12" y="100" class="sub-text">Oracle / Cloud</text>
    <line x1="12" y1="112" x2="128" y2="112" stroke="#1f2937" stroke-width="1" />
    <text x="12" y="132" class="tag-badge" fill="#38bdf8">⚡ Batch &amp; CDC</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <polygon points="175,215 185,210 185,220" fill="#38bdf8" />

  <!-- STAGE 2: BRONZE -->
  <g transform="translate(190, 140)" class="node-card">
    <rect width="140" height="150" rx="12" fill="#111827" stroke="#d97706" stroke-width="1.5" />
    <rect x="10" y="12" width="62" height="18" rx="4" fill="#78350f" />
    <text x="18" y="25" class="tag-badge" fill="#fcd34d">RAW ZONE</text>
    <text x="12" y="52" class="title-text" font-size="13">2. Delta Bronze</text>
    <text x="12" y="70" class="sub-text">Immutable Raw</text>
    <text x="12" y="85" class="sub-text">AWS S3 / ADLS</text>
    <text x="12" y="100" class="sub-text">Append-Only Feed</text>
    <line x1="12" y1="112" x2="128" y2="112" stroke="#1f2937" stroke-width="1" />
    <text x="12" y="132" class="tag-badge" fill="#fbbf24">🔒 ACID Parquet</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <polygon points="335,215 345,210 345,220" fill="#fbbf24" />

  <!-- STAGE 3: SILVER -->
  <g transform="translate(350, 140)" class="node-card">
    <rect width="140" height="150" rx="12" fill="#111827" stroke="#94a3b8" stroke-width="1.5" />
    <rect x="10" y="12" width="66" height="18" rx="4" fill="#334155" />
    <text x="17" y="25" class="tag-badge" fill="#e2e8f0">CLEANSED</text>
    <text x="12" y="52" class="title-text" font-size="13">3. Delta Silver</text>
    <text x="12" y="70" class="sub-text">PySpark Cleansing</text>
    <text x="12" y="85" class="sub-text">Schema Matching</text>
    <text x="12" y="100" class="sub-text">Deduplication</text>
    <line x1="12" y1="112" x2="128" y2="112" stroke="#1f2937" stroke-width="1" />
    <text x="12" y="132" class="tag-badge" fill="#34d399">✨ -30% Defects</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <polygon points="495,215 505,210 505,220" fill="#34d399" />

  <!-- STAGE 4: GOLD -->
  <g transform="translate(510, 140)" class="node-card">
    <rect width="140" height="150" rx="12" fill="#111827" stroke="#eab308" stroke-width="2" />
    <rect x="10" y="12" width="64" height="18" rx="4" fill="#854d0e" />
    <text x="17" y="25" class="tag-badge" fill="#fef08a">BUSINESS</text>
    <text x="12" y="52" class="title-text" font-size="13">4. Delta Gold</text>
    <text x="12" y="70" class="sub-text">Star Schemas</text>
    <text x="12" y="85" class="sub-text">Unity Catalog</text>
    <text x="12" y="100" class="sub-text">Sub-second Query</text>
    <line x1="12" y1="112" x2="128" y2="112" stroke="#1f2937" stroke-width="1" />
    <text x="12" y="132" class="tag-badge" fill="#facc15">🚀 +40% Speed</text>
  </g>

  <!-- Fork Branches to AI and FinOps -->
  <!-- BRANCH A: MOSAIC AI & CUSTOMGPT -->
  <g transform="translate(680, 110)" class="node-card">
    <rect width="240" height="95" rx="12" fill="#111827" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="20" cy="24" r="6" fill="#06b6d4" />
    <text x="34" y="28" class="title-text" font-size="13">Mosaic AI &amp; GenAI Serving</text>
    <text x="16" y="50" class="sub-text">• Model Serving Endpoints &amp; CustomGPT</text>
    <text x="16" y="66" class="sub-text">• Azure APIM rate-limiting &amp; token guardrails</text>
    <text x="16" y="82" class="tag-badge" fill="#22d3ee">🤖 SECURE ENTERPRISE INFERENCE</text>
  </g>

  <!-- BRANCH B: FINOPS & CLOUD ECONOMICS -->
  <g transform="translate(680, 225)" class="node-card">
    <rect width="240" height="95" rx="12" fill="#111827" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="20" cy="24" r="6" fill="#f43f5e" />
    <text x="34" y="28" class="title-text" font-size="13">FinOps &amp; Cloudability</text>
    <text x="16" y="50" class="sub-text">• Databricks serverless compute auto-kill</text>
    <text x="16" y="66" class="sub-text">• Multi-cloud AWS/Azure budget policies</text>
    <text x="16" y="82" class="tag-badge" fill="#fb7185">💰 ZERO BUDGET OVERRUNS</text>
  </g>
</svg>
