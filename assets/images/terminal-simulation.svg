<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .code-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulse-green {
      animation: pulseG 2s infinite ease-in-out;
    }
    @keyframes pulseG {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #22c55e); }
    }
  </style>

  <!-- Terminal Window with drop shadow -->
  <rect x="15" y="15" width="820" height="290" rx="12" fill="url(#termGrad)" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>

  <!-- Window Header -->
  <rect x="15" y="15" width="820" height="38" rx="12" fill="#1e293b"/>
  <rect x="15" y="40" width="820" height="13" fill="#1e293b"/> <!-- square bottom corners of header -->

  <!-- Window Buttons -->
  <circle cx="36" cy="34" r="6" fill="#ef4444"/>
  <circle cx="56" cy="34" r="6" fill="#eab308"/>
  <circle cx="76" cy="34" r="6" fill="#22c55e"/>

  <text x="425" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">sameer@arm-platform-lakehouse ~ (zsh)</text>

  <!-- Terminal Content -->
  <g transform="translate(35, 75)" class="code-text">
    <!-- Command Prompt -->
    <text x="0" y="0">
      <tspan fill="#38bdf8">sameer@arm</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7">~/lakehouse-production</tspan><tspan fill="#f8fafc">$</tspan>
      <tspan fill="#22c55e"> databricks platform status --cluster=prod-medallion --finops</tspan>
    </text>

    <!-- Output Lines -->
    <text x="0" y="24" fill="#94a3b8">[+] Connecting to Multi-Cloud Control Plane (AWS us-east-1 + Azure East US)...</text>
    
    <text x="0" y="48">
      <tspan fill="#38bdf8">✔ Unity Catalog Security: </tspan>
      <tspan fill="#f8fafc">SCIM Active | Zero-Trust ACLs Enforced | 100% Lineage Tracked</tspan>
    </text>

    <text x="0" y="72">
      <tspan fill="#38bdf8">✔ Medallion Delta Lake:   </tspan>
      <tspan fill="#f8fafc">Bronze (Append-Only) ➔ Silver (Cleaned) ➔ Gold (Aggregates)</tspan>
    </text>

    <text x="0" y="96">
      <tspan fill="#38bdf8">✔ Performance Metrics:   </tspan>
      <tspan fill="#4ade80">ETL Load Time -40%</tspan>
      <tspan fill="#94a3b8"> | </tspan>
      <tspan fill="#4ade80">Data Discrepancy -30%</tspan>
      <tspan fill="#94a3b8"> | </tspan>
      <tspan fill="#4ade80">SLA 99.9%</tspan>
    </text>

    <text x="0" y="120">
      <tspan fill="#38bdf8">✔ FinOps Governance:     </tspan>
      <tspan fill="#fbbf24">Serverless Auto-Kill @ 15m idle</tspan>
      <tspan fill="#94a3b8"> | </tspan>
      <tspan fill="#f43f5e">Cloudability: Zero Budget Overruns</tspan>
    </text>

    <text x="0" y="144">
      <tspan fill="#38bdf8">✔ Mosaic AI Model Serving:</tspan>
      <tspan fill="#c084fc">Azure APIM Gateway Active</tspan>
      <tspan fill="#94a3b8"> | </tspan>
      <tspan fill="#f8fafc">CustomGPT Rate-Limited &amp; Audited</tspan>
    </text>

    <!-- Next prompt with blinking cursor -->
    <text x="0" y="174">
      <tspan fill="#38bdf8">sameer@arm</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7">~/lakehouse-production</tspan><tspan fill="#f8fafc">$</tspan>
      <tspan fill="#38bdf8"> echo "Ready to architect and scale next-gen platforms."</tspan>
      <tspan fill="#00f2fe" class="cursor"> █</tspan>
    </text>
  </g>
</svg>
